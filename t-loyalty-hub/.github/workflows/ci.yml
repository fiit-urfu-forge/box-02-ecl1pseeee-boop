name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Laravel · PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t-loyalty-hub/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, intl, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: t-loyalty-hub/backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('t-loyalty-hub/backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Stage CSV fixtures
        run: |
          mkdir -p storage/app/data
          cp ../../CSV-dataset/*.csv storage/app/data/

      - name: Run PHPUnit
        run: php artisan test --env=testing

  ai-engine-tests:
    name: FastAPI · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t-loyalty-hub/ai-engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: t-loyalty-hub/ai-engine/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-build:
    name: Frontend · Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: t-loyalty-hub/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: t-loyalty-hub/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
